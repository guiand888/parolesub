[alembic]
# Package-resource form ("package:resource"), resolved via the installed
# package rather than a path relative to cwd. The runtime image no longer
# ships a source copy of audio_to_subs under /app (only alembic.ini lives
# there) - migrations are read from site-packages, same as the app code.
script_location = audio_to_subs:db/migrations
sqlalchemy.url = sqlite:////data/parolesub.db

# Additional settings for Alembic
prepend_sys_path = .
version_path_separator = os

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
